
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="css/icon.png">

    <title>Valorat</title>

    <link rel="stylesheet" href="css/style.css">


    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <main class="container">

        <div class="medalha">
            ⭐ Consumidor Consciente
        </div>

        <header class="hero">

            <div class="logo">
                💰
            </div>

            <h1>VALORAT</h1>

            <p class="subtitulo">
                A missão do Chef Matemático
            </p>

            <div class="progress-container">
                <div class="progress-bar"></div>
            </div>

            <p class="etapa">
                Etapa 1 de 3 • Planejamento
            </p>

        </header>

        <section class="card">

            <h2>📖 Receita do Dia</h2>

            <p class="descricao">
                Ajude o restaurante da escola a preparar panquecas!
            </p>

            <div class="ingredientes">

                <div class="ingrediente">
                    <div class="emoji">🌾</div>
                    <span>1 kg de Farinha</span>
                </div>

                <div class="ingrediente">
                    <div class="emoji">🥛</div>
                    <span>500 ml de Leite</span>
                </div>

                <div class="ingrediente">
                    <div class="emoji">🧁</div>
                    <span>100 g de Fermento</span>
                </div>

                <div class="ingrediente">
                    <div class="emoji">🫗</div>
                    <span>900 ml de Óleo</span>
                </div>

                <div class="ingrediente">
                    <div class="emoji">🧂</div>
                    <span>1 kg de Sal</span>
                </div>

            </div>

            </div>

            <div class="painel-financeiro">

                <div class="box dinheiro">
                    <span class="icone">💵</span>
                    <h3>Você tem</h3>
                    <p>R$ 50,00</p>
                </div>

                <div class="box orcamento">
                    <span class="icone">🎯</span>
                    <h3>Orçamento</h3>
                    <p>R$ 30,00</p>
                </div>

            </div>

            <button id="btn-jogar" onclick="window.location.href='mercado.html'">
                🚀 Iniciar Missão
            </button>

        </section>

    </main>

</body>
</html>
